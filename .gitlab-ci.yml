stages: [test, quality, build]

unit-test:
  stage: test
  image:
    name: python:3.12-slim
    pull_policy: if-not-present
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest -q

lint-type:
  stage: quality
  image:
    name: python:3.12-slim
    pull_policy: if-not-present
  needs: [unit-test]
  script:
    - python -m pip install -e ".[dev]"
    - python -m ruff check .
    - python -m mypy src

secret-scan:
  stage: quality
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
    pull_policy: if-not-present
  needs: [unit-test]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git . --redact --no-banner

image-build:
  stage: build
  image:
    name: docker:27-cli
    pull_policy: if-not-present
  services:
    - name: docker:27-dind
      pull_policy: if-not-present
  needs: [unit-test, lint-type, secret-scan]
  script:
    - docker build --tag safefix-harness:$CI_COMMIT_SHA .
